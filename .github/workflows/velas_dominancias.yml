name: Velas diarias de dominancias

on:
  schedule:
    - cron: '25 0 * * *'     # 00:25 UTC, tras el cierre diario: guarda las velas cerradas de los 3 últimos días
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: velas-dominancias
  cancel-in-progress: false

jobs:
  velas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ESTUDIOS_DOMINANCIA
          sparse-checkout-cone-mode: true      # solo la carpeta del estudio, no los 1,7 GB de velas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registrar velas (TradingView, escáner público)
        run: python ESTUDIOS_DOMINANCIA/registrar_velas.py ESTUDIOS_DOMINANCIA/velas_recientes.csv
      - name: Guardar en el repositorio
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add ESTUDIOS_DOMINANCIA/velas_recientes.csv
          git diff --cached --quiet || git commit -m "Dominancias: velas hasta $(date -u -d 'yesterday' +%F)"
          git pull --rebase --quiet || true
          git push
