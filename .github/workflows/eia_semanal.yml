name: eia_semanal
# Informe semanal de petróleo de la EIA (sin clave). Miércoles 16:45 y jueves 17:45 de Madrid (invierno = UTC+1).
on:
  schedule:
    - cron: "45 15 * * 3"
    - cron: "45 16 * * 4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eia
  cancel-in-progress: false
jobs:
  eia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas xlrd
      - run: python DATOS_EIA/eia_semanal.py
      - name: guardar
        run: |
          git config user.name "eia-bot"
          git config user.email "eia-bot@users.noreply.github.com"
          git add DATOS_EIA/semanal.csv
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "EIA semanal $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
